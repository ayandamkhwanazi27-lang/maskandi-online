{% extends "base.html" %}
{% block title %}Events — Maskandi Online Magazine{% endblock %}
{% block extra_styles %}
<style>
  .events-list { display: flex; flex-direction: column; gap: 1rem; max-width: 750px; }
  .event-card {
    background: white;
    border: 1px solid #E0E0E0;
    border-left: 5px solid var(--red);
    padding: 1.25rem 1.5rem;
    display: flex;
    gap: 1.5rem;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .event-card:hover { border-left-color: var(--yellow); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  .event-date-block {
    background: var(--red);
    color: white;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.06em;
    padding: 0.6rem 1rem;
    text-align: center;
    flex-shrink: 0;
    min-width: 100px;
  }
  .event-card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; color: #1A1A1A; }
  .event-card .loc { font-size: 0.8rem; color: #888; }
</style>
{% endblock %}
{% block content %}
<div class="page-wrap">
  <div class="section-label">Upcoming Events</div>
  <div class="events-list">
    {% for event in events %}
    <div class="event-card">
      <div class="event-date-block">{{ event.date }}</div>
      <div>
        <h3>{{ event.title }}</h3>
        <div class="loc">📍 {{ event.location }}</div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
