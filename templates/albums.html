{% extends "base.html" %}
{% block title %}Albums — Maskandi Online Magazine{% endblock %}
{% block extra_styles %}
<style>
  /* Filter bar */
  .filter-bar {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  .filter-btn {
    background: white;
    border: 2px solid #E0E0E0;
    color: #666;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.1em;
    padding: 0.4rem 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 2px;
  }
  .filter-btn:hover { border-color: var(--red); color: var(--red); }
  .filter-btn.active { background: var(--red); border-color: var(--red); color: white; }

  /* Albums grid */
  .albums-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1.25rem;
  }

  .album-card {
    background: white;
    border: 1px solid #E0E0E0;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .album-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }

  .album-cover {
    width: 100%;
    height: 200px;
    background: linear-gradient(135deg, #B0001A, #E8001C);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.5rem;
    position: relative;
    overflow: hidden;
  }
  .album-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .album-year {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.7);
    color: #FFD700;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    padding: 2px 8px;
    border-radius: 2px;
  }

  .album-body { padding: 0.9rem; }
  .album-artist {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--red);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.2rem;
  }
  .album-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.04em;
    color: #1A1A1A;
    line-height: 1.2;
    margin-bottom: 0.75rem;
  }

  .stream-btns {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
  }
  .stream-btn {
    display: inline-block;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 8px;
    text-decoration: none;
    border-radius: 2px;
    transition: opacity 0.2s;
  }
  .stream-btn:hover { opacity: 0.8; }
  .stream-btn.yt { background: #FF0000; color: white; }
  .stream-btn.sp { background: #1DB954; color: white; }
  .stream-btn.am { background: #FC3C44; color: white; }

  .no-results {
    text-align: center;
    color: #aaa;
    font-size: 0.9rem;
    padding: 3rem;
    grid-column: 1/-1;
  }

  @media (max-width: 600px) {
    .albums-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
{% endblock %}

{% block content %}
<div class="page-wrap">
  <div class="section-label">Maskandi Albums</div>

  <!-- Year filter -->
  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterYear('all', this)">All</button>
    <button class="filter-btn" onclick="filterYear('2026', this)">2026</button>
    <button class="filter-btn" onclick="filterYear('2025', this)">2025</button>
    <button class="filter-btn" onclick="filterYear('2024', this)">2024</button>
    <button class="filter-btn" onclick="filterYear('2023', this)">2023</button>
    <button class="filter-btn" onclick="filterYear('2022', this)">2022</button>
    <button class="filter-btn" onclick="filterYear('older', this)">Older</button>
  </div>

  <!-- Albums grid -->
  <div class="albums-grid" id="albums-grid">
  </div>
</div>

<script>
const albums = [
  { artist: "Menzi Ndimande", title: "EZohlala Nawe", year: "2026", emoji: "🎸", cover: "" },
  { artist: "Ntencane", title: "Awuyiphumuze", year: "2026", emoji: "🎵", cover: "" },
  { artist: "Mlabalaba", title: "Izethembiso", year: "2026", emoji: "🎶", cover: "" },
  { artist: "Bahubhe", title: "Ngiyobalanda", year: "2026", emoji: "🎵", cover: "" },
  { artist: "Khuzani", title: "Umqhele Nethawula", year: "2025", emoji: "🎸", cover: "" },
  { artist: "Mzukulu", title: "Yimi Unompempe", year: "2025", emoji: "🎵", cover: "" },
  { artist: "Sminofu", title: "Gqiba I Bigger", year: "2025", emoji: "🎶", cover: "" },
  { artist: "Mthandeni SK", title: "Amakhothangqoko", year: "2025", emoji: "🎸", cover: "" },
  { artist: "Imfezi Emnyama", title: "Imfezi Emnyama", year: "2024", emoji: "🐍", cover: "" },
  { artist: "Jaiva Zimnike", title: "Jaiva Zimnike", year: "2024", emoji: "🎵", cover: "" },
  { artist: "Saliwa", title: "Saliwa", year: "2024", emoji: "🎶", cover: "" },
  { artist: "Phiwayinkosi", title: "Phiwayinkosi", year: "2024", emoji: "🎸", cover: "" },
  { artist: "Msawawa", title: "Msawawa", year: "2024", emoji: "🎵", cover: "" },
  { artist: "Ntencane", title: "Alingeni", year: "2024", emoji: "🎶", cover: "" },
  { artist: "Khuzani", title: "Inja Nogodo", year: "2023", emoji: "🎸", cover: "" },
  { artist: "Mzukulu", title: "Ivolovolo", year: "2023", emoji: "🎵", cover: "" },
  { artist: "Mthandeni SK", title: "Impisi Iyalaya", year: "2023", emoji: "🎶", cover: "" },
  { artist: "Ntencane", title: "Isivulwe Yonke", year: "2023", emoji: "🎸", cover: "" },
  { artist: "Mlabalaba", title: "Son Of A Carpenter", year: "2023", emoji: "🎵", cover: "" },
  { artist: "Thokozani Langa", title: "I-Protection Order", year: "2022", emoji: "🎶", cover: "" },
  { artist: "Ntencane", title: "Incane Lembobo", year: "2021", emoji: "🎸", cover: "" },
  { artist: "Ntencane", title: "Uboya Enkomeni", year: "2019", emoji: "🎵", cover: "" },
];

function ytLink(artist, title) {
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(artist + ' ' + title);
}
function spLink(artist, title) {
  return 'https://open.spotify.com/search/' + encodeURIComponent(artist + ' ' + title);
}
function amLink(artist, title) {
  return 'https://music.apple.com/search?term=' + encodeURIComponent(artist + ' ' + title);
}

function renderAlbums(filter) {
  const grid = document.getElementById('albums-grid');
  const filtered = filter === 'all' ? albums :
                   filter === 'older' ? albums.filter(a => parseInt(a.year) < 2022) :
                   albums.filter(a => a.year === filter);

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-results">No albums found for this year.</div>';
    return;
  }

  grid.innerHTML = filtered.map(a => `
    <div class="album-card">
      <div class="album-cover">
        ${a.cover ? '<img src="' + a.cover + '" alt="' + a.title + '">' : a.emoji}
        <div class="album-year">${a.year}</div>
      </div>
      <div class="album-body">
        <div class="album-artist">${a.artist}</div>
        <div class="album-title">${a.title}</div>
        <div class="stream-btns">
          <a class="stream-btn yt" href="${ytLink(a.artist, a.title)}" target="_blank">▶ YouTube</a>
          <a class="stream-btn sp" href="${spLink(a.artist, a.title)}" target="_blank">Spotify</a>
          <a class="stream-btn am" href="${amLink(a.artist, a.title)}" target="_blank">Apple</a>
        </div>
      </div>
    </div>
  `).join('');
}

function filterYear(year, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAlbums(year);
}

renderAlbums('all');
</script>
{% endblock %}
